apiVersion: v1
kind: Secret
metadata:
  # Using the helper is standard practice
  name: {{ include "travelportal.fullname" . }}-auth
  labels:
    {{- include "travelportal.labels" . | nindent 4 }}
type: Opaque
data:
  travelportalpassword: {{ coalesce .Values.env.travelportalPassword .Values.env.todoPassword | default "" | b64enc | quote }}
