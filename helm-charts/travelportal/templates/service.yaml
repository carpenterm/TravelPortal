apiVersion: v1
kind: Service
metadata:
  name: {{ include "travelportal.fullname" . }}
  labels:
    {{- include "travelportal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 7540
      protocol: TCP
      name: http
  selector:
    {{- include "travelportal.selectorLabels" . | nindent 4 }}
