  selector:
    app.kubernetes.io/name: travelportal
    app.kubernetes.io/instance: release-name
---
# Source: travelportal/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-travelportal
  labels:
    helm.sh/chart: travelportal-0.2.0
    app.kubernetes.io/name: travelportal
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travelportal
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        helm.sh/chart: travelportal-0.2.0
        app.kubernetes.io/name: travelportal
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: release-name-travelportal
      containers:
        - name: travelportal
          image: "quay.io/rahulk10/travelportal:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7540
              protocol: TCP
          env:
            - name: TRAVELPORTAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: release-name-travelportal-auth
                  key: travelportalpassword
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
# Source: travelportal/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "release-name-travelportal-test-connection"
  labels:
    helm.sh/chart: travelportal-0.2.0
    app.kubernetes.io/name: travelportal
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['release-name-travelportal:80']
  restartPolicy: Never
