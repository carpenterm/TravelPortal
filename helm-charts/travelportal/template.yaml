apiVersion: v1
kind: Secret
metadata:
  # Using the helper is standard practice
  name: release-name-travelportal-auth
  labels:
    helm.sh/chart: travelportal-0.2.0
    app.kubernetes.io/name: travelportal
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.16.0"
