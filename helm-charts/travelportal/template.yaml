---
# Source: travelportal/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: release-name-travelportal
  labels:
    helm.sh/chart: travelportal-0.2.0
    app.kubernetes.io/name: travelportal
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 7540
      protocol: TCP
